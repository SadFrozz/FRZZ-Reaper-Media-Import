name: Build, test and release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Build {0} at {1}', github.ref_name, inputs.commit) || format('Release {0}', github.ref_name) }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to build
        required: true
        type: choice
        default: 'HEAD — latest commit in the selected branch'
        # GitHub Actions requires these choices to be declared in the workflow.
        options:
          - 'HEAD — latest commit in the selected branch'
          - 'a76d981 — Select manual build branch and accept short commit SHAs'
          - '62da7f6 — Build only release tags and explicitly selected commits'
          - '03bd9c5 — Document subtitle undo regression in 1.1.0'
          - '4901051 — Release 1.1.1'
          - 'ea67472 — Release 1.1.0'
          - 'dff6b64 — Initial release 1.0.0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.commit }}
  cancel-in-progress: true

jobs:
  source:
    name: Resolve source commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Require a branch for manual builds
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "Choose a branch in the Run workflow menu." >&2
            exit 1
          fi

      - name: Checkout branch or release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact commit
        id: source
        shell: bash
        env:
          BUILD_SELECTION: ${{ inputs.commit }}
        run: |
          commit="$(git rev-parse HEAD)"
          selected="${BUILD_SELECTION%% *}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$selected" != HEAD ]]; then
            if [[ ! "$selected" =~ ^[[:xdigit:]]{7,40}$ ]]; then
              echo "Select a commit in the Run workflow menu." >&2
              exit 1
            fi
            mapfile -t matches < <(git rev-parse --disambiguate="${selected,,}")
            if (( ${#matches[@]} != 1 )); then
              echo "The commit SHA in the menu is unknown or ambiguous. Update the workflow option." >&2
              exit 1
            fi
            commit="${matches[0]}"
            if [[ "$(git cat-file -t "$commit")" != commit ]] ||
               ! git merge-base --is-ancestor "$commit" HEAD; then
              echo "The selected SHA must be a commit in the selected branch's history." >&2
              exit 1
            fi
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches project version
        if: github.event_name == 'push'
        shell: bash
        run: |
          project_version="$(sed -nE 's/^project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${GITHUB_REF_NAME#v}"
          tag_base="${tag_version%%-*}"
          test -n "$project_version"
          if [[ "$tag_base" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

  windows:
    name: Windows x64
    needs: source
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, 'project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Project version was not found' }
          "value=$($match.Groups[1].Value)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          Copy-Item README.md, LICENSE stage/
          $binary = Get-Item stage/reaper_frzz_media_import.dll
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($binary.Name)" | Set-Content stage/SHA256SUMS.txt -Encoding ascii
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path stage/* -DestinationPath packages/FRZZ-Reaper-Media-Import-${{ steps.version.outputs.value }}-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: frzz-media-import-windows-x64
          path: packages/*.zip
          if-no-files-found: error

  macos:
    name: macOS Universal 2
    needs: source
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          submodules: recursive
          persist-credentials: false

      - name: Configure x86_64
        run: cmake --preset macos-x86_64

      - name: Build and test x86_64
        run: |
          cmake --build --preset mac-x86-release
          ctest --preset mac-x86-release

      - name: Configure arm64
        run: cmake --preset macos-arm64

      - name: Cross-build arm64
        run: cmake --build --preset mac-arm-release

      - name: Read project version
        id: version
        run: |
          version="$(sed -nE 's/^project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create and verify Universal 2 package
        run: |
          mkdir -p stage packages
          lipo -create \
            build-macos-x86_64/reaper_frzz_media_import.dylib \
            build-macos-arm64/reaper_frzz_media_import.dylib \
            -output stage/reaper_frzz_media_import.dylib
          lipo stage/reaper_frzz_media_import.dylib -verify_arch x86_64 arm64
          codesign --force --sign - stage/reaper_frzz_media_import.dylib
          codesign --verify --strict stage/reaper_frzz_media_import.dylib
          cp README.md LICENSE stage/
          (cd stage && shasum -a 256 reaper_frzz_media_import.dylib > SHA256SUMS.txt)
          ditto -c -k --sequesterRsrc stage packages/FRZZ-Reaper-Media-Import-${{ steps.version.outputs.value }}-macos-universal.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: frzz-media-import-macos-universal
          path: packages/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [source, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false

      - name: Build release notes from changelog
        shell: bash
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > changelog-section.md

          if [[ ! -s changelog-section.md ]]; then
            echo "Changelog section for $GITHUB_REF_NAME is missing or empty" >&2
            exit 1
          fi

          {
            echo "Reaper Media Import Extension $GITHUB_REF_NAME"
            echo
            echo "[Русский](#русский) · [English](#english)"
            cat changelog-section.md
          } > release-notes.md

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: frzz-media-import-windows-x64
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: frzz-media-import-macos-universal
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "FRZZ Reaper Media Import $GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "FRZZ Reaper Media Import $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${prerelease[@]}"
          fi

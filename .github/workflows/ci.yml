name: Build, test and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, 'project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw 'Project version was not found' }
          "value=$($match.Groups[1].Value)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage
          Copy-Item README.md, LICENSE stage/
          $binary = Get-Item stage/reaper_frzz_media_import.dll
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($binary.Name)" | Set-Content stage/SHA256SUMS.txt -Encoding ascii
          New-Item -ItemType Directory -Force packages | Out-Null
          Compress-Archive -Path stage/* -DestinationPath packages/FRZZ-Reaper-Media-Import-${{ steps.version.outputs.value }}-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: frzz-media-import-windows-x64
          path: packages/*.zip
          if-no-files-found: error

  macos:
    name: macOS Universal 2
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure x86_64
        run: cmake --preset macos-x86_64

      - name: Build and test x86_64
        run: |
          cmake --build --preset mac-x86-release
          ctest --preset mac-x86-release

      - name: Configure arm64
        run: cmake --preset macos-arm64

      - name: Cross-build arm64
        run: cmake --build --preset mac-arm-release

      - name: Read project version
        id: version
        run: |
          version="$(sed -nE 's/^project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Create and verify Universal 2 package
        run: |
          mkdir -p stage packages
          lipo -create \
            build-macos-x86_64/reaper_frzz_media_import.dylib \
            build-macos-arm64/reaper_frzz_media_import.dylib \
            -output stage/reaper_frzz_media_import.dylib
          lipo stage/reaper_frzz_media_import.dylib -verify_arch x86_64 arm64
          codesign --force --sign - stage/reaper_frzz_media_import.dylib
          codesign --verify --strict stage/reaper_frzz_media_import.dylib
          cp README.md LICENSE stage/
          (cd stage && shasum -a 256 reaper_frzz_media_import.dylib > SHA256SUMS.txt)
          ditto -c -k --sequesterRsrc stage packages/FRZZ-Reaper-Media-Import-${{ steps.version.outputs.value }}-macos-universal.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: frzz-media-import-macos-universal
          path: packages/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify tag matches project version
        shell: bash
        run: |
          project_version="$(sed -nE 's/^project\(FRZZReaperMediaImport VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          tag_version="${GITHUB_REF_NAME#v}"
          tag_base="${tag_version%%-*}"
          test -n "$project_version"
          if [[ "$tag_base" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          fi

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: frzz-media-import-windows-x64
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v8
        with:
          name: frzz-media-import-macos-universal
          path: release-assets

      - name: Create release checksums
        shell: bash
        run: (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --title "FRZZ Reaper Media Import $GITHUB_REF_NAME" \
              --generate-notes \
              "${prerelease[@]}"
          fi
